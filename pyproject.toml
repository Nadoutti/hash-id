[project]
name = "hash-id"
version = "1.0.0"
description = "Identifica tipos de hash atravez de duas abordagens, lógica(prefixo, comprimento, charset, etc) e atravez de ML"

requires-python = ">=3.13"

authors = [{ name = "Pedro Nadotti", email = "nadottipedro5@gmail.com" }]

readme = "README.md"
license = { text = "AGPL-3.0-or-later" }

dependencies = [
  "rich>=15.0.0",
]

[project.scripts]
hashid = "logic.main:main"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "ruff>=0.15.12",
  "mypy>=2.1.0",
  "pylint>=4.0.5",
  "yapf>=0.43.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logic"]

[tool.mypy]
python_version = "3.13"

disallow_untyped_defs = true
disallow_incomplete_defs = true

no_implicit_optional = true

warn_redundant_casts = true

warn_no_return = true

show_error_codes = true
pretty = true

[tool.pylint.main]
py-version = "3.13"

jobs = 4

[tool.pylint.messages_control]
disable = [
  "R0903",
  "C0103",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# `src` no caminho de import para que `import logic.main` funcione mesmo sem
# o projeto instalado no venv. `tests` para que os testes importem conftest.
pythonpath = ["src", "tests"]

python_files = ["test_*.py"]

addopts = "-v --tb=short"

[tool.ruff]
target-version = "py313"

line-length = 88

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "B",
  "C4",
  "UP",
  "SIM",
]

ignore = [
  "E501",
]
